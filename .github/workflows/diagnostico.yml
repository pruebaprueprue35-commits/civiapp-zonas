name: Diagnóstico de fuentes

# Prueba las direcciones de las fuentes públicas y guarda un informe en la rama "registros".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow pandas
      - name: Diagnosticar
        run: python scripts/diagnostico_fuentes.py --salida /tmp/diagnostico.md
      - name: Guardar informe en la rama registros
        if: always()
        run: |
          git config user.name "civiapp-zonas[bot]"
          git config user.email "civiapp-zonas@users.noreply.github.com"
          git fetch origin registros || true
          git switch registros 2>/dev/null || git switch --orphan registros
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name registros -exec rm -rf {} +
          mkdir -p registros
          cp /tmp/diagnostico.md "registros/diagnostico-${GITHUB_RUN_ID}.md" 2>/dev/null || echo "sin informe" > "registros/diagnostico-${GITHUB_RUN_ID}.md"
          git add registros
          git commit -m "Diagnóstico de fuentes ${GITHUB_RUN_ID}"
          git push origin registros
